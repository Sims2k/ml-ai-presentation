name: Verify public review outside Tailnet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published files without a Tailnet connection
        env:
          REVIEW_URL: https://agentbox.tail289ef2.ts.net:8443/ml-ai-presentation/
        run: |
          mkdir -p /tmp/public-review
          for file in index.html presentation.html presentation.pdf presenter-guide.pdf speaker-notes.pdf slides.json; do
            curl --fail --location --silent --show-error --retry 2 --max-time 40 \
              "$REVIEW_URL$file" --output "/tmp/public-review/$file"
            cmp "docs/$file" "/tmp/public-review/$file"
          done
          echo 'The public review serves the committed slide and notes files without a Tailnet connection.' >> "$GITHUB_STEP_SUMMARY"
